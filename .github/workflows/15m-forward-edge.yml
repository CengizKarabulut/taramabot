name: 15m Raw Forward Edge
run-name: "15m · A-I · Raw Forward Edge"

on:
  push:
    paths:
      - ".github/15m-forward-edge-bootstrap"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download persistent 15m and 1D archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data/history
          for period in 15m 1D; do
            name="historical-live-${period}"
            id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
            test -n "${id}"
            mkdir -p "/tmp/${period}"
            gh api "repos/${REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/${period}.zip"
            unzip -q -o "/tmp/${period}.zip" -d "/tmp/${period}"
            src="$(find "/tmp/${period}" -type f -name '*.sqlite' | head -n1)"
            test -s "${src}"
            cp "${src}" "data/history/${period}.sqlite"
          done
      - name: Measure raw forward edge for A-I
        run: |
          python signal_forward_edge.py \
            --db data/history/15m.sqlite \
            --daily-db data/history/1D.sqlite \
            --warmup 240 \
            --max-symbols 0 \
            --output reports/15m-forward-edge.json
      - name: Upload event-study report
        uses: actions/upload-artifact@v4
        with:
          name: 15m-forward-edge-${{ github.run_id }}
          path: reports/15m-forward-edge.json
          if-no-files-found: error
          retention-days: 30
