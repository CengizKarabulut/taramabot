name: Historical Symbol Profiles
run-name: "Historical Profiles · A-I x Core Timeframes · ${{ github.run_id }}"

on:
  workflow_run:
    workflows:
      - "Long History Incremental Archive"
    types:
      - completed
  workflow_dispatch:
  push:
    paths:
      - ".github/historical-symbol-profiles-bootstrap"

permissions:
  actions: write
  contents: read

concurrency:
  group: historical-symbol-profiles
  cancel-in-progress: true

jobs:
  core-profile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        period: ["1H", "4H", "1D", "1W"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Ham 15m ve 1D arsivlerini indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data/history /tmp/h15 /tmp/h1d
          get_history() {
            local artifact_name="$1"
            local target="$2"
            local tempdir="$3"
            local id
            id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
            test -n "${id}"
            gh api "repos/${REPOSITORY}/actions/artifacts/${id}/zip" > "${tempdir}.zip"
            unzip -q -o "${tempdir}.zip" -d "${tempdir}"
            src="$(find "${tempdir}" -type f -name '*.sqlite' | head -n1)"
            test -s "${src}"
            cp "${src}" "${target}"
          }
          # 15m yalnizca 1H/4H turetimi icin ic veri kaynagidir.
          get_history historical-live-15m data/history/historical_15m.sqlite /tmp/h15
          get_history historical-live-1D data/history/historical_1D.sqlite /tmp/h1d
      - name: ${{ matrix.period }} profillerini hesapla
        run: |
          mkdir -p data/profiles
          python symbol_historical_profiles.py \
            --intraday-db data/history/historical_15m.sqlite \
            --daily-db data/history/historical_1D.sqlite \
            --periods "${{ matrix.period }}" \
            --warmup 240 \
            --max-symbols 0 \
            --output "data/profiles/profile-${{ matrix.period }}.json"
      - name: Periyot profil parcasini sakla
        uses: actions/upload-artifact@v4
        with:
          name: profile-part-${{ matrix.period }}
          path: data/profiles/profile-${{ matrix.period }}.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

  merge-and-publish:
    needs: [core-profile]
    if: always() && needs.core-profile.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Profil parcalarini indir
        uses: actions/download-artifact@v4
        with:
          pattern: profile-part-*
          path: data/profile-parts
          merge-multiple: true
      - name: Profilleri birlestir
        run: |
          set -euo pipefail
          ls -lah data/profile-parts
          python merge_symbol_profiles.py \
            data/profile-parts/profile-1H.json \
            data/profile-parts/profile-4H.json \
            data/profile-parts/profile-1D.json \
            data/profile-parts/profile-1W.json \
            --output data/historical_symbol_profiles.json
      - name: Profil artifact kalite kapisi
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('data/historical_symbol_profiles.json').read_text(encoding='utf-8'))
          required = ['1H', '4H', '1D', '1W']
          missing = [p for p in required if p not in payload.get('periods', {})]
          if missing:
              raise SystemExit(f'Eksik timeframe: {missing}')
          counts = {p: len(payload['periods'][p]) for p in required}
          if counts['1D'] < 400:
              raise SystemExit(f'Profil kapsami yetersiz: {counts}')
          best_count = len(payload.get('best_by_symbol', {}))
          if best_count < 300:
              raise SystemExit(f'Yeterli hisse icin best profile yok: {best_count}')
          print(json.dumps({'passed': True, 'counts': counts, 'best': best_count}, ensure_ascii=False, indent=2))
          PY
      - name: Guncel profil artifactini sakla
        uses: actions/upload-artifact@v4
        with:
          name: historical-symbol-profiles-latest
          path: data/historical_symbol_profiles.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Eski profil artifactlarini temizle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/artifacts?name=historical-symbol-profiles-latest&per_page=100" |
            jq -r '.artifacts | sort_by(.created_at) | reverse | .[1:][]?.id' |
            while read -r artifact_id; do
              if [ -n "${artifact_id}" ]; then
                gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
              fi
            done
