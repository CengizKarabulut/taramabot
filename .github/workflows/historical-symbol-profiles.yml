name: Historical Symbol Profiles
run-name: "Historical Profiles · A-I x Timeframe · ${{ github.run_id }}"

on:
  workflow_run:
    workflows:
      - "Long History Incremental Archive"
    types:
      - completed
  workflow_dispatch:
  push:
    paths:
      - ".github/historical-symbol-profiles-bootstrap"

permissions:
  actions: write
  contents: read

concurrency:
  group: historical-symbol-profiles
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt

      - name: Son 15m 1D ve 1M uzun-gecmis arsivlerini indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data/history /tmp/h15 /tmp/h1d /tmp/h1m

          download_history() {
            local name="$1"
            local target="$2"
            local tempdir="$3"
            local id
            id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
            if [ -z "${id}" ]; then
              echo "Eksik artifact: ${name}" >&2
              exit 1
            fi
            gh api "repos/${REPOSITORY}/actions/artifacts/${id}/zip" > "${tempdir}.zip"
            unzip -q -o "${tempdir}.zip" -d "${tempdir}"
            src="$(find "${tempdir}" -type f -name '*.sqlite' | head -n1)"
            test -s "${src}"
            cp "${src}" "${target}"
            echo "${name}: artifact ${id}"
          }

          download_history historical-live-15m data/history/historical_15m.sqlite /tmp/h15
          download_history historical-live-1D data/history/historical_1D.sqlite /tmp/h1d
          download_history historical-live-1M data/history/historical_1M.sqlite /tmp/h1m

      - name: Profil kodunu derle
        run: |
          python -m py_compile \
            symbol_historical_profiles.py \
            monthly_symbol_profiles.py \
            merge_symbol_profiles.py \
            historical_profile_sender.py \
            signal_parity.py \
            bist_timeframes.py

      - name: Tum hisse A-I x timeframe profillerini hesapla
        run: |
          set -euo pipefail
          mkdir -p data/profiles

          # Intraday 30m-4H production ile birebir olacak sekilde derin 15m'den turetilir.
          # 1W derin 1D'den turetilir. 1M ise 200+ aylik mum gerektiren gostergeler
          # nedeniyle ayri derin aylik arsivden hesaplanir.
          python symbol_historical_profiles.py \
            --intraday-db data/history/historical_15m.sqlite \
            --daily-db data/history/historical_1D.sqlite \
            --periods 15m,30m,45m,1H,2H,4H,1D,1W \
            --warmup 240 \
            --max-symbols 0 \
            --output data/profiles/profile-core.json

          python monthly_symbol_profiles.py \
            --db data/history/historical_1M.sqlite \
            --warmup 240 \
            --max-symbols 0 \
            --output data/profiles/profile-monthly.json

          python merge_symbol_profiles.py \
            data/profiles/profile-core.json \
            data/profiles/profile-monthly.json \
            --output data/historical_symbol_profiles.json

      - name: Profil artifact kalite kapisi
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/historical_symbol_profiles.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          required = ['15m','30m','45m','1H','2H','4H','1D','1W','1M']
          missing = [p for p in required if p not in payload.get('periods', {})]
          if missing:
              raise SystemExit(f'Eksik timeframe: {missing}')
          counts = {p: len(payload['periods'][p]) for p in required}
          if counts['15m'] < 400 or counts['1D'] < 400:
              raise SystemExit(f'Profil kapsamı yetersiz: {counts}')
          if len(payload.get('best_by_symbol', {})) < 300:
              raise SystemExit('Yeterli hisse icin best profile uretilemedi')
          print(json.dumps({'passed': True, 'counts': counts, 'best': len(payload['best_by_symbol'])}, ensure_ascii=False, indent=2))
          PY

      - name: Guncel profil artifactini sakla
        uses: actions/upload-artifact@v4
        with:
          name: historical-symbol-profiles-latest
          path: data/historical_symbol_profiles.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Eski profil artifactlarini temizle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/artifacts?name=historical-symbol-profiles-latest&per_page=100" |
            jq -r '.artifacts | sort_by(.created_at) | reverse | .[1:][]?.id' |
            while read -r artifact_id; do
              if [ -n "${artifact_id}" ]; then
                gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
              fi
            done
