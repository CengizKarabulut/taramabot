name: Rebuild Clean Live Snapshot
run-name: "Live Snapshot · Rebuild from Persistent History"

on:
  push:
    paths:
      - ".github/rebuild-live-snapshot-bootstrap"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: rebuild-live-snapshot
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download nine persistent history archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data/history
          for period in 15m 30m 45m 1H 2H 4H 1D 1W 1M; do
            name="historical-live-${period}"
            id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
            test -n "${id}"
            mkdir -p "/tmp/${period}"
            gh api "repos/${REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/${period}.zip"
            unzip -q -o "/tmp/${period}.zip" -d "/tmp/${period}"
            src="$(find "/tmp/${period}" -type f -name '*.sqlite' | head -n1)"
            test -s "${src}"
            cp "${src}" "data/history/${period}.sqlite"
          done
      - name: Build compact clean live snapshot
        run: |
          python rebuild_live_snapshot_from_history.py \
            --db data/market_data.sqlite \
            --manifest data/manifest.json \
            --source 15m:data/history/15m.sqlite \
            --source 30m:data/history/30m.sqlite \
            --source 45m:data/history/45m.sqlite \
            --source 1H:data/history/1H.sqlite \
            --source 2H:data/history/2H.sqlite \
            --source 4H:data/history/4H.sqlite \
            --source 1D:data/history/1D.sqlite \
            --source 1W:data/history/1W.sqlite \
            --source 1M:data/history/1M.sqlite
      - name: Validate cross-timeframe alignment
        run: |
          python validate_live_snapshot_integrity.py \
            --db data/market_data.sqlite \
            --max-symbols 150 \
            --output data/timeframe-integrity.json
      - name: Smoke-test nine scanners without Telegram/state
        env:
          MARKET_DATA_DB: ${{ github.workspace }}/data/market_data.sqlite
          DISABLE_TELEGRAM: "true"
        run: |
          python parallel_snapshot_scan.py \
            --db data/market_data.sqlite \
            --market bist \
            --no-state \
            --summary data/rebuild-scan-summary.json
      - name: Publish clean market-data-latest
        uses: actions/upload-artifact@v4
        with:
          name: market-data-latest
          path: |
            data/market_data.sqlite
            data/manifest.json
            data/timeframe-integrity.json
            data/rebuild-scan-summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
