name: 15m Parity + Baseline Backtest
run-name: "15m · Python Parity · A-I Baseline"

on:
  push:
    paths:
      - ".github/intraday-15m-baseline-bootstrap"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: intraday-15m-baseline
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download latest production snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/market
          artifact_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=market-data-latest&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/market.zip
          unzip -q -o /tmp/market.zip -d /tmp/market
          db="$(find /tmp/market -type f -name 'market_data.sqlite' | head -n1)"
          test -s "${db}"
          cp "${db}" data/market_data.sqlite
      - name: Compare production and vector A-I states
        run: |
          python validate_signal_parity.py \
            --db data/market_data.sqlite \
            --period 15m \
            --max-symbols 40 \
            --samples-per-symbol 10 \
            --warmup 240 \
            --output reports/parity/python_vector_15m.json
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15m-python-parity-${{ github.run_id }}
          path: reports/parity/
          if-no-files-found: warn
          retention-days: 30

  baseline:
    needs: parity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scanner:
          - macd_cross
          - h8
          - i9
          - ema
          - rsi_macd
          - new_scan
          - smi_macd_full
          - smi_macd
          - rsi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download persistent 15m and 1D archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data/history /tmp/h15 /tmp/h1d
          get_artifact() {
            local name="$1"
            local destination="$2"
            local zipfile="$3"
            local artifact_id
            artifact_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
            if [ -z "${artifact_id}" ]; then
              echo "Artifact bulunamadi: ${name}" >&2
              exit 1
            fi
            gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${zipfile}"
            unzip -q -o "${zipfile}" -d "${destination}"
          }
          get_artifact historical-live-15m /tmp/h15 /tmp/h15.zip
          get_artifact historical-live-1D /tmp/h1d /tmp/h1d.zip
          db15="$(find /tmp/h15 -type f -name '*.sqlite' | head -n1)"
          db1d="$(find /tmp/h1d -type f -name '*.sqlite' | head -n1)"
          test -s "${db15}"
          test -s "${db1d}"
          cp "${db15}" data/history/historical_15m.sqlite
          cp "${db1d}" data/history/historical_1D.sqlite
      - name: Replay ${{ matrix.scanner }} on full BIST 15m archive
        run: |
          python intraday_historical_replay.py \
            --db data/history/historical_15m.sqlite \
            --daily-db data/history/historical_1D.sqlite \
            --strategy "${{ matrix.scanner }}" \
            --period 15m \
            --max-symbols 0 \
            --warmup 240 \
            --output-dir "reports/15m-baseline/${{ matrix.scanner }}"
      - name: Print metrics
        if: always()
        run: |
          if compgen -G "reports/15m-baseline/${{ matrix.scanner }}/*_metrics.json" > /dev/null; then
            cat reports/15m-baseline/${{ matrix.scanner }}/*_metrics.json
          fi
      - name: Upload baseline result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15m-baseline-${{ matrix.scanner }}-${{ github.run_id }}
          path: reports/15m-baseline/${{ matrix.scanner }}/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
