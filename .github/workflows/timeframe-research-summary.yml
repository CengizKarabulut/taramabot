name: Timeframe Research Summary
run-name: "Timeframe Research Summary · 1H/4H + Extended"

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: "1H/4H research run id"
        required: true
        default: "33934090077"
      extended_run_id:
        description: "15m/30m/45m/2H/1W/1M research run id"
        required: true
        default: "33934764128"
      supplemental_run_id:
        description: "Optional retry/supplemental run id (for example 15m EMA + new_scan retry)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: timeframe-research-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download research artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CORE_RUN_ID: ${{ inputs.core_run_id }}
          EXTENDED_RUN_ID: ${{ inputs.extended_run_id }}
          SUPPLEMENTAL_RUN_ID: ${{ inputs.supplemental_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf-zips artifacts/timeframe

          download_run() {
            local run_id="$1"
            [ -n "${run_id}" ] || return 0
            echo "Collecting artifacts from run ${run_id}"
            gh api --paginate "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("tf-")) | [.id, .name] | @tsv' |
            while IFS=$'\t' read -r artifact_id artifact_name; do
              [ -n "${artifact_id:-}" ] || continue
              safe_name="$(printf '%s' "${artifact_name}" | tr '/: ' '___')"
              zip_path="/tmp/tf-zips/${safe_name}.zip"
              out_dir="artifacts/timeframe/${safe_name}"
              mkdir -p "${out_dir}"
              gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${zip_path}"
              unzip -q -o "${zip_path}" -d "${out_dir}"
            done
          }

          download_run "${CORE_RUN_ID}"
          download_run "${EXTENDED_RUN_ID}"
          download_run "${SUPPLEMENTAL_RUN_ID}"

          echo "JSON files collected: $(find artifacts/timeframe -type f -name '*.json' | wc -l)"

      - name: Build production matrix
        run: |
          python timeframe_research_summary.py \
            --root artifacts/timeframe \
            --output-json reports/timeframe/research_summary.json \
            --output-md reports/timeframe/research_summary.md
          cat reports/timeframe/research_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research summary
        uses: actions/upload-artifact@v4
        with:
          name: timeframe-research-summary-${{ github.run_id }}
          path: reports/timeframe/
          if-no-files-found: error
          retention-days: 90
