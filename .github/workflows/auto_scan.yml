name: Auto Market Scanner (Hourly 10:30-18:30 TRT)

on:
  schedule:
    # Türkiye saati ile 10:30 - 18:30 arası her saat başı (UTC 7:30 - 15:30)
    - cron: "30 7-15 * * *"
  workflow_dispatch:

jobs:
  scan-all-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: 🔍 Run Market Scan (ALL PERIODS)
        env:
          # Sizin secret isimlerinize göre eşleştirildi
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          TV_CHART_ID: ${{ secrets.TV_CHART_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "🚀 ÇOKLU TARAMA BAŞLIYOR..."
          
          echo "⏳ --- 4 SAATLİK TARAMA ---"
          python main.py scan 4H bist
          
          echo "📅 --- GÜNLÜK TARAMA ---"
          python main.py scan 1D bist
          
          echo "📆 --- HAFTALIK TARAMA ---"
          python main.py scan 1W bist

      - name: 📊 Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: |
            state.json
            screenshots/*.png
          retention-days: 7

      - name: 📧 Send completion notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            TR_TIME=$(TZ='Europe/Istanbul' date '+%Y-%m-%d %H:%M')
            if [ "${{ job.status }}" == "success" ]; then
              MESSAGE="✅ Tüm Taramalar Tamamlandı! (4H + 1D + 1W)%0A🕐 $TR_TIME%0A📁 Grafikler Telegram'a gönderildi."
            else
              MESSAGE="❌ Tarama HATALI!%0A🕐 $TR_TIME%0A⚠️ Lütfen GitHub Actions loglarını kontrol edin."
            fi
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML" || true
          fi
