name: StockMarketLab Sinyal Botu
run-name: "StockMarketLab Sinyal Botu - ${{ github.event.schedule || github.event.action || github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Manuel calistirma modu"
        required: true
        default: "multi"
        type: choice
        options:
          - multi
          - single
          - smart_force
      market_type:
        description: "Taranacak pazar"
        required: true
        default: "bist"
        type: choice
        options:
          - bist
          - nasdaq
          - sp500
          - emtia
          - kripto
      period:
        description: "single modu icin zaman dilimi"
        required: true
        default: "1D"
        type: choice
        options:
          - 15m
          - 30m
          - 45m
          - 1H
          - 2H
          - 4H
          - 1D
          - 1W
          - 1M
      use_state:
        description: "Daha once gonderilen sinyalleri filtrele"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: auto-scan-state
  cancel-in-progress: false

jobs:
  scan-all-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 🛡️ Decide whether this run should scan
        id: scan_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          run_scan=true
          continue_chain=false

          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            continue_chain=true
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            case "${SCHEDULE_EXPRESSION}" in
              "30 5 * * 1-5")
                # 08:30 acilis oncesi turu bagimsizdir.
                ;;
              "0 8 * * 1-5")
                continue_chain=true
                ;;
              "15,30 8 * * 1-5")
                continue_chain=true
                cutoff="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
                existing_count="$(
                  gh api "repos/${REPOSITORY}/actions/workflows/auto_scan.yml/runs?per_page=30" |
                    jq --argjson current "${GITHUB_RUN_ID}" --arg cutoff "${cutoff}" '
                      [.workflow_runs[]
                        | select(.id != $current)
                        | select(.created_at >= $cutoff)
                        | select(
                            .event == "repository_dispatch"
                            or (.event == "schedule" and .display_title == "StockMarketLab Sinyal Botu - 0 8 * * 1-5")
                          )
                        | select(.status == "queued" or .status == "in_progress" or .conclusion == "success")]
                      | length
                    '
                )"

                if [ "${existing_count}" -gt 0 ]; then
                  echo "Yakın zamanda çalışan/başarılı bir otomatik zincir bulundu; watchdog taraması atlandı."
                  run_scan=false
                  continue_chain=false
                else
                  echo "11:00 zinciri bulunamadı; watchdog yeni zinciri başlatacak."
                fi
                ;;
            esac
          fi

          echo "run_scan=${run_scan}" >> "${GITHUB_OUTPUT}"
          echo "continue_chain=${continue_chain}" >> "${GITHUB_OUTPUT}"

      - name: 📥 Checkout code
        if: steps.scan_gate.outputs.run_scan == 'true'
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        if: steps.scan_gate.outputs.run_scan == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        if: steps.scan_gate.outputs.run_scan == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🍪 Setup TradingView cookies
        if: steps.scan_gate.outputs.run_scan == 'true'
        env:
          TV_COOKIES: ${{ secrets.TV_COOKIES }}
        run: |
          if [ -n "$TV_COOKIES" ]; then
            echo "$TV_COOKIES" > tv_cookies.txt
          fi

      - name: Run Market Scan
        if: steps.scan_gate.outputs.run_scan == 'true'
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          TV_CHART_ID: ${{ secrets.TV_CHART_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID || secrets.TG_THREAD_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Planli zincirde tum zaman dilimlerini sirayla tara.
            python main.py multi bist
            exit 0
          fi

          STATE_FLAG=""
          if [ "${{ inputs.use_state }}" = "false" ]; then
            STATE_FLAG="--nostate"
          fi

          if [ "${{ inputs.mode }}" = "single" ]; then
            python main.py scan "${{ inputs.period }}" "${{ inputs.market_type }}" $STATE_FLAG
          elif [ "${{ inputs.mode }}" = "smart_force" ]; then
            # Zaman kontrolunu atlar, tum periyotlari hemen tarar.
            python main.py auto "${{ inputs.market_type }}" --force $STATE_FLAG
          else
            # Manuel varsayilan: tum periyotlari hemen tarar.
            python main.py multi "${{ inputs.market_type }}" $STATE_FLAG
          fi

      - name: 💾 Persist state.json
        if: always() && steps.scan_gate.outputs.run_scan == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/scanned_state.json
          git restore --source=HEAD --worktree -- state.json
          git pull --rebase origin ${{ github.ref_name }}
          python state_merge.py \
            --base state.json \
            --incoming /tmp/scanned_state.json \
            --output state.json
          python -m json.tool state.json > /dev/null
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update state.json [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 🔁 Continue continuous scan chain
        if: success() && steps.scan_gate.outputs.continue_chain == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CHAIN_START_TR: "11:00"
          LAST_DISPATCH_TR: "16:25"
        run: |
          set -euo pipefail

          day_of_week="$(TZ=Europe/Istanbul date +%u)"
          now_tr="$(TZ=Europe/Istanbul date +%H:%M)"

          if [ "${day_of_week}" -gt 5 ]; then
            echo "Hafta sonu; yeni tarama tetiklenmedi."
            exit 0
          fi

          to_minutes() {
            local value="$1"
            local hour="${value%%:*}"
            local minute="${value##*:}"
            echo $((10#${hour} * 60 + 10#${minute}))
          }

          now_minutes="$(to_minutes "${now_tr}")"
          start_minutes="$(to_minutes "${CHAIN_START_TR}")"
          last_dispatch_minutes="$(to_minutes "${LAST_DISPATCH_TR}")"

          if (( now_minutes < start_minutes || now_minutes >= last_dispatch_minutes )); then
            echo "Saat ${now_tr}; yeni tur icin izin verilen pencere ${CHAIN_START_TR}-${LAST_DISPATCH_TR}. Zincir tamamlandi."
            exit 0
          fi

          echo "Saat ${now_tr}; siradaki tarama tetikleniyor."
          gh api --method POST \
            "repos/${REPOSITORY}/dispatches" \
            -f event_type='taramabot-continuous-scan'
