name: Auto Market Scanner (Every 30min)

on:
  schedule:
    - cron: "0,30 5-20 * * *"
  workflow_dispatch:

jobs:
  scan-all-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas python-dotenv requests matplotlib mplfinance
          # tvdatafeed'i PyPI'dan yükle
          pip install tvdatafeed || echo "PyPI installation failed, trying alternative..."

      - name: 🔍 Verify tvdatafeed installation
        run: |
          python -c "from tvDatafeed import TvDatafeed; print('✅ tvdatafeed installed successfully')" || \
          echo "⚠️ tvdatafeed import failed"

      - name: ⏰ Check Turkish timezone (08:00-23:30)
        id: time_check
        run: |
          TR_HOUR=$(TZ='Europe/Istanbul' date +%H)
          TR_MIN=$(TZ='Europe/Istanbul' date +%M)
          TR_TIME=$(TZ='Europe/Istanbul' date '+%H:%M')
          
          echo "🕐 Türkiye Saati: $TR_TIME"
          
          if [ $TR_HOUR -ge 8 ] && [ $TR_HOUR -le 23 ]; then
            if [ $TR_HOUR -eq 23 ] && [ $TR_MIN -gt 30 ]; then
              echo "⏸️ Tarama saati dışında (23:30 sonrası)"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "✅ Tarama yapılacak"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⏸️ Tarama saati dışında (08:00 öncesi)"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔐 Test TradingView Connection
        if: steps.time_check.outputs.skip == 'false'
        env:
          TV_USER: ${{ secrets.TV_USER }}
          TV_PASS: ${{ secrets.TV_PASS }}
        run: |
          python -c "
          from tvDatafeed import TvDatafeed
          import os
          try:
              username = os.getenv('TV_USER')
              password = os.getenv('TV_PASS')
              if username and password:
                  print(f'Attempting login with user: {username[:3]}***')
                  tv = TvDatafeed(username=username, password=password)
                  print('✅ TradingView login successful!')
              else:
                  print('⚠️ No credentials provided - using guest mode')
                  tv = TvDatafeed()
          except Exception as e:
              print(f'⚠️ Connection warning: {e}')
              print('Will continue with guest mode.')
          " || echo "Connection test completed"

      - name: 🔍 Run Market Scan (ALL PERIODS)
        if: steps.time_check.outputs.skip == 'false'
        env:
          TV_USER: ${{ secrets.TV_USER }}
          TV_PASS: ${{ secrets.TV_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MAX_ITEMS: "25"
          TG_SLEEP_BETWEEN_PHOTOS: "1.5"
        run: |
          echo "🚀 ÇOKLU TARAMA BAŞLIYOR..."
          
          echo "⏳ --- 4 SAATLİK TARAMA BAŞLIYOR ---"
          python tara.py tarama 4H all || echo "⚠️ 4H tarama hatası - devam ediliyor"
          
          sleep 10
          
          echo "📅 --- GÜNLÜK TARAMA BAŞLIYOR ---"
          python tara.py tarama 1D all || echo "⚠️ 1D tarama hatası - devam ediliyor"
          
          sleep 10
          
          echo "📆 --- HAFTALIK TARAMA BAŞLIYOR ---"
          python tara.py tarama 1W all || echo "⚠️ 1W tarama hatası"

      - name: 📊 Upload scan results
        if: steps.time_check.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: |
            *.csv
            market_tarama.db
            outputs/charts/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: 📧 Send completion notification
        if: steps.time_check.outputs.skip == 'false' && always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            TR_TIME=$(TZ='Europe/Istanbul' date '+%Y-%m-%d %H:%M')
            if [ "${{ job.status }}" == "success" ]; then
              MESSAGE="✅ Tüm Taramalar Tamamlandı! (4H + 1D + 1W)%0A🕐 $TR_TIME%0A📁 Sonuçlar GitHub Actions'ta"
            else
              MESSAGE="⚠️ Tarama Tamamlandı (Bazı hatalar olabilir)%0A🕐 $TR_TIME%0A📋 Lütfen logları kontrol edin"
            fi
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML" || true
          fi
