name: Auto Market Scanner (Smart Scheduler)

on:
  schedule:
    # Her 15 dakikada bir çalışarak tarama saatlerini kollar.
    # GitHub gecikse bile 45 dakikalık tolerans sayesinde taramayı kaçırmaz.
    # Türkiye saati ile 09:00 - 19:00 arasını kapsar.
    - cron: "*/15 6-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-scan-state
  cancel-in-progress: false

jobs:
  scan-all-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🍪 Setup TradingView cookies
        env:
          TV_COOKIES: ${{ secrets.TV_COOKIES }}
        run: |
          if [ -n "$TV_COOKIES" ]; then
            echo "$TV_COOKIES" > tv_cookies.txt
          fi

      - name: 🔍 Run Market Scan (Smart Mode)
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          TV_CHART_ID: ${{ secrets.TV_CHART_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # 'auto' komutu ile bot sadece zamanı gelmişse çalışır
          python main.py auto

      - name: 💾 Persist state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update state.json [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
