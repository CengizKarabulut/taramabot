- name: 🔍 Run Market Scan (ALL PERIODS)
        if: steps.time_check.outputs.skip == 'false'
        env:
          TV_USER: ${{ secrets.TV_USER }}
          TV_PASS: ${{ secrets.TV_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_MAX_ITEMS: "50"
          TG_SLEEP_BETWEEN_PHOTOS: "1.5"
        run: |
          echo "🚀 ÇOKLU TARAMA BAŞLIYOR..."
          
          echo "⏳ --- 4 SAATLİK TARAMA ---"
          python tara.py tarama 4H all
          
          echo "📅 --- GÜNLÜK TARAMA ---"
          python tara.py tarama 1D all
          
          echo "📆 --- HAFTALIK TARAMA ---"
          python tara.py tarama 1W all
