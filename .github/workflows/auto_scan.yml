name: Auto Market Scanner (Smart Scheduler)

on:
  schedule:
    # Her 15 dakikada bir çalışarak tarama saatlerini kollar.
    # GitHub gecikse bile 45 dakikalık tolerans sayesinde taramayı kaçırmaz.
    # Türkiye saati ile 09:00 - 19:00 arasını kapsar.
    - cron: "*/15 6-16 * * 1-5"
  repository_dispatch:
    types:
      - taramabot-auto-scan
  workflow_dispatch:
    inputs:
      mode:
        description: "Manuel calistirma modu"
        required: true
        default: "multi"
        type: choice
        options:
          - multi
          - single
          - smart_force
      market_type:
        description: "Taranacak pazar"
        required: true
        default: "bist"
        type: choice
        options:
          - bist
          - nasdaq
          - sp500
          - emtia
          - kripto
      period:
        description: "single modu icin zaman dilimi"
        required: true
        default: "1D"
        type: choice
        options:
          - 15m
          - 1H
          - 4H
          - 1D
          - 1W
          - 1M
      use_state:
        description: "Daha once gonderilen sinyalleri filtrele"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-scan-state
  cancel-in-progress: false

jobs:
  scan-all-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🍪 Setup TradingView cookies
        env:
          TV_COOKIES: ${{ secrets.TV_COOKIES }}
        run: |
          if [ -n "$TV_COOKIES" ]; then
            echo "$TV_COOKIES" > tv_cookies.txt
          fi

      - name: Run Market Scan
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          TV_CHART_ID: ${{ secrets.TV_CHART_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID || secrets.TG_THREAD_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Planli kosularda bot sadece zamani gelmis taramayi calistirir.
            python main.py auto bist
            exit 0
          fi

          STATE_FLAG=""
          if [ "${{ inputs.use_state }}" = "false" ]; then
            STATE_FLAG="--nostate"
          fi

          if [ "${{ inputs.mode }}" = "single" ]; then
            python main.py scan "${{ inputs.period }}" "${{ inputs.market_type }}" $STATE_FLAG
          elif [ "${{ inputs.mode }}" = "smart_force" ]; then
            # Zaman kontrolunu atlar, tum periyotlari hemen tarar.
            python main.py auto "${{ inputs.market_type }}" --force $STATE_FLAG
          else
            # Manuel varsayilan: tum periyotlari hemen tarar.
            python main.py multi "${{ inputs.market_type }}" $STATE_FLAG
          fi

      - name: 💾 Persist state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update state.json [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
