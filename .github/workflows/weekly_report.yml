name: Weekly Performance Report

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weekly_report.yml"
      - "weekly_report.py"
      - "telegram_sender.py"
      - "scanner.py"
      - "main.py"
      - "config.py"
      - "individual_scanners/**"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/weekly_report.yml"
      - "weekly_report.py"
      - "telegram_sender.py"
      - "scanner.py"
      - "main.py"
      - "config.py"
      - "individual_scanners/**"
      - "requirements.txt"
  schedule:
    # Cuma günü TRT 20:00 (UTC 17:00). GitHub Actions zaman zaman gecikebilir;
    # ekrana erken gelmesi için saati erken alabilirsin.
    - cron: "0 17 * * 5"
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Hangi strateji için rapor üretilsin?'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smi_macd
          - rsi
          - new_scan
          - rsi_macd
          - ema
          - macd_cross

jobs:
  validate:
    name: validate weekly report code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ✅ Compile Python files
        run: |
          python -m py_compile \
            weekly_report.py \
            telegram_sender.py \
            main.py \
            scanner.py \
            individual_scanners/scan_ema.py \
            individual_scanners/scan_macd_cross.py \
            individual_scanners/scan_new_scan.py \
            individual_scanners/scan_rsi.py \
            individual_scanners/scan_rsi_macd.py \
            individual_scanners/scan_smi_macd.py

  report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Bir strateji çökse bile diğerleri devam etsin
      fail-fast: false
      # Aynı anda 2 paralel job: tvdatafeed rate-limit'ine takılmamak için tutuyoruz
      max-parallel: 2
      matrix:
        strategy: [smi_macd, rsi, new_scan, rsi_macd, ema, macd_cross]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv pandas numpy
          pip install git+https://github.com/saidsurucu/borsapy.git
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: 🔎 Should this matrix entry run?
        id: gate
        run: |
          # workflow_dispatch ile 'all' veya bu stratejinin kendisi seçilirse,
          # ya da schedule ile tetiklenirse çalıştır
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.strategy }}" = "all" ] || \
               [ "${{ github.event.inputs.strategy }}" = "${{ matrix.strategy }}" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Generate and Send Report (${{ matrix.strategy }})
        if: steps.gate.outputs.run == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          echo "🚀 ${{ matrix.strategy }} haftalık raporu hazırlanıyor..."
          python weekly_report.py ${{ matrix.strategy }}
