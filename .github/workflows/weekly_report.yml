name: Weekly Performance Report

on:
  schedule:
    # Cuma akşamı 20:00 TRT (UTC 17:00)
    - cron: "0 17 * * 5"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv pandas numpy
          pip install git+https://github.com/saidsurucu/borsapy.git
          # DİKKAT: Projenin geri kalanıyla aynı (çalışan) tvdatafeed kaynağı.
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: 📊 Generate and Send Weekly Report
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # Opsiyonel: anonim tvdatafeed limitlerine takılmamak için ekleyin
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python weekly_report.py
