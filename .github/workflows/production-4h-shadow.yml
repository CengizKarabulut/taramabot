name: Production 4H Shadow
run-name: "4H Production · source ${{ github.event.workflow_run.id || inputs.source_run_id || 'latest-artifact' }}"

on:
  workflow_run:
    workflows: ["StockMarketLab 15 Dakika Snapshot Taramasi"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Snapshot workflow run id; empty uses latest successful market-data artifact"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/production-4h-shadow-bootstrap"

permissions:
  actions: read
  contents: read

concurrency:
  group: production-4h-shadow
  cancel-in-progress: true

jobs:
  production:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download exact market snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data /tmp/market-data
          source_run_id="${MANUAL_RUN_ID:-}"
          if [ -z "${source_run_id}" ] && [ "${EVENT_NAME}" = "workflow_run" ]; then source_run_id="${WORKFLOW_RUN_ID}"; fi
          if [ -n "${source_run_id}" ]; then
            artifact_id="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${source_run_id}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "market-data-latest" and .expired == false) | .id' | tail -n1)"
          else
            artifact_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=market-data-latest&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          fi
          test -n "${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/market-data.zip
          unzip -q -o /tmp/market-data.zip -d /tmp/market-data
          if [ -f /tmp/market-data/data/market_data.sqlite ]; then cp /tmp/market-data/data/market_data.sqlite data/market_data.sqlite; else cp /tmp/market-data/market_data.sqlite data/market_data.sqlite; fi
          test -s data/market_data.sqlite
      - name: Build closed-bar 4H candidate report
        run: python production_4h.py --db data/market_data.sqlite --exchange BIST --min-score 75 --output-dir data/production-4h
      - name: Build professional technical charts
        env:
          MPLBACKEND: Agg
        run: python production_4h_visual.py --db data/market_data.sqlite --candidates data/production-4h/candidates.json --output-dir data/production-4h
      - name: Load latest BIST peer fundamentals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/fundamentals /tmp/fundamental-data
          artifact_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=fundamental-data-latest&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -n "${artifact_id}" ]; then
            gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/fundamental-data.zip
            unzip -q -o /tmp/fundamental-data.zip -d /tmp/fundamental-data
            if [ -f /tmp/fundamental-data/data/fundamentals/latest.csv ]; then
              cp -r /tmp/fundamental-data/data/fundamentals/. data/fundamentals/
            elif [ -f /tmp/fundamental-data/latest.csv ]; then
              cp -r /tmp/fundamental-data/. data/fundamentals/
            fi
          fi
          if [ -s data/fundamentals/latest.csv ]; then
            python - <<'PY' || rm -f data/fundamentals/latest.csv data/fundamentals/manifest.json
          import pandas as pd
          p = pd.read_csv('data/fundamentals/latest.csv')
          metrics = [c for c in ('pe','pb','ev_ebitda','ev_sales','roe','roa','net_margin','ebitda_margin') if c in p.columns]
          if not metrics or max(int(pd.to_numeric(p[c], errors='coerce').notna().sum()) for c in metrics) == 0:
              raise SystemExit('cached fundamental snapshot has no usable metrics')
          print('Cached fundamental snapshot validated:', len(p), 'rows;', metrics)
          PY
          fi
          if [ ! -s data/fundamentals/latest.csv ]; then
            echo "No valid cached peer snapshot; refreshing now."
            python fundamental_peer_refresh.py --output-dir data/fundamentals
          fi
          test -s data/fundamentals/latest.csv
      - name: Fetch 8-quarter statements for current candidates
        run: |
          python fundamental_data_pipeline.py candidates \
            --visual-json data/production-4h/visual_candidates.json \
            --peer-csv data/fundamentals/latest.csv \
            --output-dir data/fundamentals/quarterly
      - name: Build concise institutional reports
        env:
          MPLBACKEND: Agg
        run: |
          python institutional_stock_report.py \
            --visual-json data/production-4h/visual_candidates.json \
            --fundamentals-csv data/fundamentals/latest.csv \
            --fundamental-trends-dir data/fundamentals/quarterly \
            --output-dir data/production-4h/reports
          cat data/production-4h/visual_report.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Kurumsal kısa raporlar" >> "$GITHUB_STEP_SUMMARY"
          find data/production-4h/reports -name report.md -maxdepth 2 -print | sort | while read f; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo "" >> "$GITHUB_STEP_SUMMARY"; done
      - name: Upload 4H production report
        uses: actions/upload-artifact@v4
        with:
          name: production-4h-latest
          path: |
            data/production-4h
            data/fundamentals/quarterly
            data/fundamentals/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
