name: Production 4H Shadow
run-name: "4H Production · source ${{ github.event.workflow_run.id || inputs.source_run_id }}"

on:
  workflow_run:
    workflows: ["StockMarketLab 15 Dakika Snapshot Taramasi"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Snapshot workflow run id; empty uses latest successful market-data artifact"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: production-4h-shadow
  cancel-in-progress: true

jobs:
  production:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt

      - name: Download exact market snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data /tmp/market-data

          source_run_id="${MANUAL_RUN_ID:-}"
          if [ -z "${source_run_id}" ] && [ "${EVENT_NAME}" = "workflow_run" ]; then
            source_run_id="${WORKFLOW_RUN_ID}"
          fi

          if [ -n "${source_run_id}" ]; then
            artifact_id="$(
              gh api --paginate "repos/${REPOSITORY}/actions/runs/${source_run_id}/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.name == "market-data-latest" and .expired == false) | .id' | tail -n1
            )"
          else
            artifact_id="$(
              gh api "repos/${REPOSITORY}/actions/artifacts?name=market-data-latest&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
            )"
          fi

          test -n "${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/market-data.zip
          unzip -q -o /tmp/market-data.zip -d /tmp/market-data
          if [ -f /tmp/market-data/data/market_data.sqlite ]; then
            cp /tmp/market-data/data/market_data.sqlite data/market_data.sqlite
          else
            cp /tmp/market-data/market_data.sqlite data/market_data.sqlite
          fi
          test -s data/market_data.sqlite

      - name: Build closed-bar 4H candidate report
        run: |
          python production_4h.py \
            --db data/market_data.sqlite \
            --exchange BIST \
            --min-score 75 \
            --output-dir data/production-4h
          cat data/production-4h/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload 4H production report
        uses: actions/upload-artifact@v4
        with:
          name: production-4h-latest
          path: data/production-4h
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
