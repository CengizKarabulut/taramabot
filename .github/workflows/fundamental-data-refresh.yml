name: Fundamental Data Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/fundamental-data-refresh-bootstrap"
  schedule:
    # 18:45 Europe/Istanbul = 15:45 UTC
    - cron: "45 15 * * 1-5"

permissions:
  contents: read

concurrency:
  group: fundamental-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Refresh BIST peer fundamentals
        run: |
          python fundamental_peer_refresh.py --output-dir data/fundamentals
          python - <<'PY'
          import json, pandas as pd
          p = pd.read_csv('data/fundamentals/latest.csv')
          m = json.load(open('data/fundamentals/manifest.json', encoding='utf-8'))
          print(f'Fundamental peer rows: {len(p)}')
          print('Columns:', ', '.join(p.columns))
          print('Non-null metrics:', m.get('metric_non_null'))
          print('Sector mapped:', m.get('sector_non_generic'))
          PY
      - name: Upload fundamental snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-data-latest
          path: data/fundamentals
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
