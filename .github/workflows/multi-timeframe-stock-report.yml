name: Multi-Timeframe Stock Report

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "BIST sembolleri (virgül veya boşlukla ayırın)"
        required: false
        default: "ZGYO"
  push:
    branches: [main]
    paths:
      - '.github/mtf-report-bootstrap'

permissions:
  actions: read
  contents: read

concurrency:
  group: multi-timeframe-stock-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download latest market snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/market-data
          artifact_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=market-data-latest&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/market-data.zip
          unzip -q -o /tmp/market-data.zip -d /tmp/market-data
          if [ -f /tmp/market-data/data/market_data.sqlite ]; then cp /tmp/market-data/data/market_data.sqlite data/market_data.sqlite; else cp /tmp/market-data/market_data.sqlite data/market_data.sqlite; fi
          test -s data/market_data.sqlite
      - name: Build multi-timeframe context
        env:
          MPLBACKEND: Agg
          INPUT_SYMBOLS: ${{ inputs.symbols }}
        run: |
          symbols="${INPUT_SYMBOLS:-ZGYO}"
          python multi_timeframe_context.py --db data/market_data.sqlite --symbols "$symbols" --output-dir data/multi-timeframe
          find data/multi-timeframe -name mtf_context.md -maxdepth 2 -print | sort | while read f; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo "" >> "$GITHUB_STEP_SUMMARY"; done
      - name: Upload multi-timeframe report
        uses: actions/upload-artifact@v4
        with:
          name: multi-timeframe-stock-report
          path: data/multi-timeframe
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
