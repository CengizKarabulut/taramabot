name: Karar Paneli Günlük BIST Tüm
run-name: "Karar Paneli · ${{ github.event_name }} · Eşik ${{ inputs.min_score || '70' }}"

on:
  workflow_dispatch:
    inputs:
      min_score:
        description: "Minimum toplam puan"
        required: true
        default: "70"
        type: choice
        options:
          - "70"
          - "75"
      charts:
        description: "Actions çıktısında üretilecek grafik sayısı"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "5"
          - "10"
permissions:
  contents: read

concurrency:
  group: decision-panel-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-decision-panel.txt

      - name: Hafif tarama bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-decision-panel.txt

      - name: BIST Tüm günlük taramasını çalıştır ve Telegram'a gönder
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID || secrets.TG_THREAD_ID }}
          MIN_SCORE: ${{ inputs.min_score || '70' }}
          CHARTS: ${{ inputs.charts || '0' }}
        run: >-
          python decision_panel_scan.py
          --universe XUTUM
          --period 2y
          --min-score "$MIN_SCORE"
          --min-turnover-mn 25
          --batch-size 20
          --workers 3
          --charts "$CHARTS"
          --output-dir artifacts/decision-panel
          --telegram

      - name: Tarama çıktılarını Actions artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-panel-${{ github.run_number }}
          path: artifacts/decision-panel
          if-no-files-found: warn
          retention-days: 14
