name: Verify Incremental Live Refresh
run-name: "Live Snapshot · Incremental Refresh Verification"

on:
  push:
    paths:
      - ".github/test-incremental-live-refresh-bootstrap"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download latest clean live snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/live
          id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=market-data-latest&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "${id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${id}/zip" > /tmp/live.zip
          unzip -q -o /tmp/live.zip -d /tmp/live
          src="$(find /tmp/live -type f -name 'market_data.sqlite' | head -n1)"
          test -s "${src}"
          cp "${src}" data/market_data.sqlite
          echo "source_artifact=${id}"
      - name: Run real incremental refresh path
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python market_data_refresh.py \
            --mode intraday \
            --db data/market_data.sqlite \
            --manifest data/manifest.json \
            --recent-bars 64 \
            --retries 3
      - name: Validate post-refresh timeframe integrity
        run: |
          python validate_live_snapshot_integrity.py \
            --db data/market_data.sqlite \
            --max-symbols 150 \
            --output data/timeframe-integrity-post-refresh.json
      - name: Smoke-test all nine scanners
        env:
          MARKET_DATA_DB: ${{ github.workspace }}/data/market_data.sqlite
          DISABLE_TELEGRAM: "true"
        run: |
          python parallel_snapshot_scan.py \
            --db data/market_data.sqlite \
            --market bist \
            --no-state \
            --summary data/incremental-scan-summary.json
      - name: Require full snapshot coverage on every timeframe
        run: |
          python validate_scan_coverage.py \
            --db data/market_data.sqlite \
            --summary data/incremental-scan-summary.json
      - name: Require production-vector 15m signal parity
        run: |
          python validate_signal_parity.py \
            --db data/market_data.sqlite \
            --period 15m \
            --max-symbols 40 \
            --samples-per-symbol 10 \
            --warmup 240 \
            --output data/python-vector-parity.json
      - name: Publish verified refreshed snapshot
        uses: actions/upload-artifact@v4
        with:
          name: market-data-latest
          path: |
            data/market_data.sqlite
            data/manifest.json
            data/timeframe-integrity-post-refresh.json
            data/incremental-scan-summary.json
            data/python-vector-parity.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
