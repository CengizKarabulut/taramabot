name: NE ARARSAN VAR Histogram Walk Forward
run-name: "NE ARARSAN VAR histogram AL+SAT WF · ${{ github.run_id }}"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/ne-ararsan-var-histogram-wf-bootstrap"

permissions:
  actions: read
  contents: read

concurrency:
  group: ne-ararsan-var-histogram-wf
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        period: ["15m", "30m", "45m", "1H", "2H", "4H", "1D", "1W", "1M"]

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0" "numpy>=1.24"

      - name: Son uzun-gecmis artifactini indir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PERIOD: ${{ matrix.period }}
        run: |
          set -euo pipefail
          mkdir -p data/history /tmp/history
          name="historical-live-${PERIOD}"
          artifact_id="$(
            gh api "repos/${REPOSITORY}/actions/artifacts?name=${name}&per_page=100" |
              jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
          )"
          if [ -z "${artifact_id}" ]; then
            echo "::error::${name} artifact bulunamadi."
            exit 2
          fi
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/history.zip
          unzip -q -o /tmp/history.zip -d /tmp/history
          sqlite_path="$(find /tmp/history -type f -name '*.sqlite' | head -n1 || true)"
          test -n "${sqlite_path}"
          cp "${sqlite_path}" "data/history/historical_${PERIOD}.sqlite"

      - name: Kodu derle
        run: |
          python -m py_compile ne_ararsan_var_histogram_wf.py ne_ararsan_var_research.py market_data_store.py

      - name: Histogram AL ve SAT walk-forward testi
        run: |
          mkdir -p reports/ne-ararsan-var-histogram
          python ne_ararsan_var_histogram_wf.py \
            --db "data/history/historical_${{ matrix.period }}.sqlite" \
            --period "${{ matrix.period }}" \
            --output "reports/ne-ararsan-var-histogram/${{ matrix.period }}.json"

      - name: Sonucu artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: ne-ararsan-var-histogram-${{ matrix.period }}-${{ github.run_id }}
          path: reports/ne-ararsan-var-histogram/${{ matrix.period }}.json
          if-no-files-found: error
          retention-days: 30
