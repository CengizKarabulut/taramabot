name: All Strategies Historical Backtest
run-name: "Full BIST · 9 Strategies · 1D"

on:
  push:
    paths:
      - ".github/all-strategies-backtest-bootstrap"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: all-strategies-historical-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scanner:
          - macd_cross
          - h8
          - i9
          - ema
          - rsi_macd
          - new_scan
          - smi_macd_full
          - smi_macd
          - rsi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt

      - name: Download latest real market snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/market-snapshot
          artifact_id="$(
            gh api "repos/${REPOSITORY}/actions/artifacts?name=market-data-latest&per_page=100" |
              jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
          )"
          if [ -z "${artifact_id}" ]; then
            echo "market-data-latest artifact bulunamadı" >&2
            exit 1
          fi
          echo "Market snapshot artifact: ${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/market-data.zip
          unzip -q -o /tmp/market-data.zip -d /tmp/market-snapshot
          if [ -f /tmp/market-snapshot/data/market_data.sqlite ]; then
            cp /tmp/market-snapshot/data/market_data.sqlite data/market_data.sqlite
          elif [ -f /tmp/market-snapshot/market_data.sqlite ]; then
            cp /tmp/market-snapshot/market_data.sqlite data/market_data.sqlite
          else
            echo "market_data.sqlite bulunamadı" >&2
            exit 1
          fi
          test -s data/market_data.sqlite

      - name: Verify full BIST snapshot
        run: |
          python - <<'PY'
          from market_data_store import MarketDataStore
          with MarketDataStore('data/market_data.sqlite', read_only=True) as store:
              symbols = store.list_symbols('BIST', '1D')
              print('1D BIST sembol sayısı:', len(symbols))
              if len(symbols) < 500:
                  raise SystemExit(f'Beklenenden az BIST sembolü: {len(symbols)}')
          PY

      - name: Replay ${{ matrix.scanner }} over full BIST
        run: |
          python historical_replay.py \
            --db data/market_data.sqlite \
            --strategy "${{ matrix.scanner }}" \
            --period "1D" \
            --max-symbols 0 \
            --warmup 240 \
            --output-dir "reports/backtest/${{ matrix.scanner }}"

      - name: Print metrics
        if: always()
        run: |
          if compgen -G "reports/backtest/${{ matrix.scanner }}/*_metrics.json" > /dev/null; then
            cat reports/backtest/${{ matrix.scanner }}/*_metrics.json
          fi

      - name: Upload strategy result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-bist-${{ matrix.scanner }}-1D-${{ github.run_id }}
          path: reports/backtest/${{ matrix.scanner }}/
          if-no-files-found: warn
          retention-days: 30
