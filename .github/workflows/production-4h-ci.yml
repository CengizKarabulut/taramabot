name: Production 4H CI

on:
  pull_request:
    paths:
      - "production_4h.py"
      - "production_4h_visual.py"
      - "institutional_stock_report.py"
      - "fundamental_score.py"
      - "tests/test_production_4h.py"
      - "tests/test_production_4h_visual.py"
      - "tests/test_institutional_stock_report.py"
      - "decision_panel_v645_signal.py"
      - "indicators.py"
      - "filters.py"
      - "exit_engine.py"
      - "market_data_store.py"
      - ".github/workflows/production-4h-ci.yml"
      - ".github/workflows/production-4h-shadow.yml"
  push:
    branches: [main]
    paths:
      - "production_4h.py"
      - "production_4h_visual.py"
      - "institutional_stock_report.py"
      - "fundamental_score.py"
      - "tests/test_production_4h.py"
      - "tests/test_production_4h_visual.py"
      - "tests/test_institutional_stock_report.py"
      - "decision_panel_v645_signal.py"
      - "indicators.py"
      - "filters.py"
      - "exit_engine.py"
      - "market_data_store.py"
      - ".github/workflows/production-4h-ci.yml"
      - ".github/workflows/production-4h-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-4h-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Compile
        run: python -m py_compile production_4h.py production_4h_visual.py fundamental_score.py institutional_stock_report.py tests/test_production_4h.py tests/test_production_4h_visual.py tests/test_institutional_stock_report.py
      - name: Unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest -v tests.test_production_4h tests.test_production_4h_visual tests.test_institutional_stock_report
