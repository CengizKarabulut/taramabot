name: Strategy Historical Backtest
run-name: "Backtest · ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'rsi_macd' }} · ${{ github.event_name == 'workflow_dispatch' && inputs.period || '1D' }}"

on:
  push:
    paths:
      - ".github/strategy-backtest-bootstrap"
  workflow_dispatch:
    inputs:
      strategy:
        description: "Tarama stratejisi"
        required: true
        type: choice
        default: rsi_macd
        options:
          - macd_cross
          - h8
          - i9
          - ema
          - rsi_macd
          - new_scan
          - smi_macd_full
          - smi_macd
          - rsi
      period:
        description: "İlk doğrulama için 1D önerilir"
        required: true
        default: "1D"
        type: choice
        options: ["1D"]
      max_symbols:
        description: "0=tüm BIST, ilk test için 50 önerilir"
        required: true
        default: "50"
        type: string
      warmup:
        description: "Sinyal öncesi minimum geçmiş bar"
        required: true
        default: "240"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: strategy-backtest-${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'rsi_macd' }}-${{ github.event_name == 'workflow_dispatch' && inputs.period || '1D' }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.strategy || 'rsi_macd' }}
      BACKTEST_PERIOD: ${{ github.event_name == 'workflow_dispatch' && inputs.period || '1D' }}
      BACKTEST_MAX_SYMBOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_symbols || '50' }}
      BACKTEST_WARMUP: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup || '240' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download latest market snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/market-snapshot
          artifact_id="$(
            gh api "repos/${REPOSITORY}/actions/artifacts?name=market-data-latest&per_page=100" |
              jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
          )"
          if [ -z "${artifact_id}" ]; then
            echo "market-data-latest artifact bulunamadı" >&2
            exit 1
          fi
          echo "Kullanılan market-data-latest artifact id: ${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/market-data.zip
          unzip -q -o /tmp/market-data.zip -d /tmp/market-snapshot
          if [ -f /tmp/market-snapshot/data/market_data.sqlite ]; then
            cp /tmp/market-snapshot/data/market_data.sqlite data/market_data.sqlite
          elif [ -f /tmp/market-snapshot/market_data.sqlite ]; then
            cp /tmp/market-snapshot/market_data.sqlite data/market_data.sqlite
          else
            echo "market_data.sqlite artifact içinde bulunamadı" >&2
            exit 1
          fi
          test -s data/market_data.sqlite
      - name: Snapshot sanity check
        run: |
          python - <<'PY'
          from market_data_store import MarketDataStore
          with MarketDataStore('data/market_data.sqlite', read_only=True) as store:
              symbols = store.list_symbols('BIST', '${{ env.BACKTEST_PERIOD }}')
              print('Snapshot BIST sembol sayısı:', len(symbols))
              print('İlk 10 sembol:', symbols[:10])
              if not symbols:
                  raise SystemExit('Seçilen periyotta BIST verisi yok')
          PY
      - name: Historical replay
        run: |
          python historical_replay.py \
            --db data/market_data.sqlite \
            --strategy "${BACKTEST_STRATEGY}" \
            --period "${BACKTEST_PERIOD}" \
            --max-symbols "${BACKTEST_MAX_SYMBOLS}" \
            --warmup "${BACKTEST_WARMUP}" \
            --output-dir reports/backtest
      - name: Show metrics
        if: always()
        run: |
          if compgen -G "reports/backtest/*_metrics.json" > /dev/null; then
            cat reports/backtest/*_metrics.json
          fi
      - name: Upload backtest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ env.BACKTEST_STRATEGY }}-${{ env.BACKTEST_PERIOD }}-${{ github.run_id }}
          path: reports/backtest/
          if-no-files-found: warn
          retention-days: 30
