name: StockMarketLab Scheduler Watchdog
run-name: "Snapshot Watchdog · ${{ inputs.recovery_mode || github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      recovery_mode:
        description: "Manuel watchdog testi"
        required: true
        default: "intraday"
        type: choice
        options:
          - intraday
          - full_refresh

permissions:
  actions: write
  contents: read

concurrency:
  group: stockmarketlab-scheduler-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Manuel recovery testi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          MANUAL_MODE: ${{ inputs.recovery_mode }}
          TARGET_WORKFLOW: cached_continuous_scan.yml
        shell: bash
        run: |
          set -euo pipefail

          if [ "${MANUAL_MODE:-intraday}" = "full_refresh" ]; then
            gh workflow run "${TARGET_WORKFLOW}" \
              --repo "${REPOSITORY}" \
              --ref main \
              -f mode=full_refresh \
              -f send_telegram=false
          else
            now_tr="$(TZ=Europe/Istanbul date +%H:%M)"
            hour="${now_tr%%:*}"
            minute="${now_tr##*:}"
            now_min=$((10#${hour} * 60 + 10#${minute}))
            if (( now_min < 630 || now_min > 1095 )); then
              echo "Intraday recovery 10:30-18:15 disinda engellendi: ${now_tr}"
              exit 0
            fi
            gh workflow run "${TARGET_WORKFLOW}" \
              --repo "${REPOSITORY}" \
              --ref main \
              -f mode=intraday_once \
              -f send_telegram=true
          fi
