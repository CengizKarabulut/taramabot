name: StockMarketLab Zaman Dilimi Snapshot Taramasi
run-name: "Snapshot Tarama · ${{ github.event.schedule || inputs.mode || github.event_name }}"

on:
  schedule:
    # Europe/Istanbul = UTC+3. Otomatik taramalar yalnızca hafta içi çalışır.
    # 1H: 10:20, 11:20, 12:20, 13:20, 14:20, 15:20, 16:20, 17:20, 17:40, 18:20
    - cron: "20 7-15 * * 1-5"
    - cron: "40 14 * * 1-5"
    # 4H: 11:00, 13:00, 14:30, 16:30, 17:30, 18:30
    - cron: "0 8,10 * * 1-5"
    - cron: "30 11,13-15 * * 1-5"
    # 1D: 10:45, 12:45, 14:45, 16:45, 17:45, 18:45
    - cron: "45 7,9,11,13-15 * * 1-5"
    # 1W: 10:30, 13:45, 16:00, 17:25, 19:00
    - cron: "30 7 * * 1-5"
    - cron: "45 10 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "25 14 * * 1-5"
    - cron: "0 16 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "Calistirma modu"
        required: true
        default: "intraday_once"
        type: choice
        options:
          - intraday_once
          - full_refresh
          - scan_only
      periods:
        description: "Manuel taramada zaman dilimi"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - 1H
          - 4H
          - 1D
          - 1W
      send_telegram:
        description: "Manuel taramada Telegram mesaji gonder"
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

# Snapshot/state bütünlüğü için taramabot koşuları tek kuyrukta tutulur. Cron
# tetikleri yine belirtilen slotlarda oluşur; uzun süren bir önceki koşu varsa
# sonraki koşu güvenli biçimde sıraya girer.
concurrency:
  group: cached-market-pipeline
  cancel-in-progress: false

jobs:
  refresh-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      run_mode: ${{ steps.gate.outputs.run_mode }}
      run_pipeline: ${{ steps.gate.outputs.run_pipeline }}
      closing_run: ${{ steps.gate.outputs.closing_run }}
      scan_periods: ${{ steps.gate.outputs.scan_periods }}

    steps:
      - name: Calisma modunu ve zaman dilimini belirle
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_PERIODS: ${{ inputs.periods }}
        run: |
          set -euo pipefail

          run_pipeline=true
          run_mode=intraday
          closing_run=false
          scan_periods="1H,4H,1D,1W"
          day_of_week="$(TZ=Europe/Istanbul date +%u)"
          now_tr="$(TZ=Europe/Istanbul date +%H:%M)"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${MANUAL_MODE}" in
              full_refresh)
                run_mode=full
                ;;
              scan_only)
                run_mode=scan_only
                ;;
              *)
                run_mode=intraday
                ;;
            esac

            case "${MANUAL_PERIODS:-all}" in
              all|ALL|"") scan_periods="1H,4H,1D,1W" ;;
              1H|4H|1D|1W) scan_periods="${MANUAL_PERIODS}" ;;
              *)
                echo "Desteklenmeyen manuel zaman dilimi: ${MANUAL_PERIODS}"
                exit 1
                ;;
            esac
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            if [ "${day_of_week}" -gt 5 ]; then
              echo "Hafta sonu; otomatik BIST taramasi atlandi."
              run_pipeline=false
            fi

            case "${SCHEDULE_EXPRESSION}" in
              "20 7-15 * * 1-5"|"40 14 * * 1-5")
                scan_periods="1H"
                ;;
              "0 8,10 * * 1-5"|"30 11,13-15 * * 1-5")
                scan_periods="4H"
                ;;
              "45 7,9,11,13-15 * * 1-5")
                scan_periods="1D"
                ;;
              "30 7 * * 1-5"|"45 10 * * 1-5"|"0 13 * * 1-5"|"25 14 * * 1-5"|"0 16 * * 1-5")
                scan_periods="1W"
                ;;
              *)
                echo "Bilinmeyen otomatik tarama slotu: ${SCHEDULE_EXPRESSION}"
                exit 1
                ;;
            esac

            # 19:00 haftalik kosu gunun son state snapshot'ini da kalici hale getirir.
            if [ "${SCHEDULE_EXPRESSION}" = "0 16 * * 1-5" ]; then
              closing_run=true
            fi
          fi

          echo "run_pipeline=${run_pipeline}" >> "${GITHUB_OUTPUT}"
          echo "run_mode=${run_mode}" >> "${GITHUB_OUTPUT}"
          echo "closing_run=${closing_run}" >> "${GITHUB_OUTPUT}"
          echo "scan_periods=${scan_periods}" >> "${GITHUB_OUTPUT}"
          echo "TR saati ${now_tr}; mode=${run_mode}; calis=${run_pipeline}; periods=${scan_periods}; kapanis=${closing_run}"

      - name: Kodu al
        if: steps.gate.outputs.run_pipeline == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 kur
        if: steps.gate.outputs.run_pipeline == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt

      - name: Hafif tarama bagimliliklarini kur
        if: steps.gate.outputs.run_pipeline == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt

      - name: Son saglam veri ve sinyal snapshot'larini geri yukle
        if: steps.gate.outputs.run_pipeline == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/market-snapshots /tmp/state-snapshot

          download_latest_artifact() {
            local artifact_name="$1"
            local zip_path="$2"
            local destination="$3"
            local artifact_id

            artifact_id="$(
              gh api "repos/${REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" |
                jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
            )"

            if [ -z "${artifact_id}" ]; then
              echo "${artifact_name} bulunamadi; ilk kurulum davranisi uygulanacak."
              return 0
            fi

            gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${zip_path}"
            unzip -q -o "${zip_path}" -d "${destination}"
            echo "${artifact_name} geri yuklendi (artifact ${artifact_id})."
          }

          download_latest_artifact market-data-latest /tmp/market-data.zip /tmp/market-snapshots
          if [ -f /tmp/market-snapshots/data/market_data.sqlite ]; then
            cp /tmp/market-snapshots/data/market_data.sqlite data/market_data.sqlite
          elif [ -f /tmp/market-snapshots/market_data.sqlite ]; then
            cp /tmp/market-snapshots/market_data.sqlite data/market_data.sqlite
          fi

          download_latest_artifact scanner-state-latest /tmp/scanner-state.zip /tmp/state-snapshot
          if [ -f /tmp/state-snapshot/state.json ]; then
            cp /tmp/state-snapshot/state.json state.json
          fi

      - name: Piyasa veri snapshot'ini artimli guncelle
        id: refresh
        if: steps.gate.outputs.run_pipeline == 'true' && steps.gate.outputs.run_mode != 'scan_only'
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          set -euo pipefail
          mode="${{ steps.gate.outputs.run_mode }}"

          if [ "${mode}" = "intraday" ] && [ ! -s data/market_data.sqlite ]; then
            echo "Onceki snapshot yok; yalnizca ilk kurulum/kurtarma icin bir defalik tam veri yenilemesi yapilacak."
            mode=full
          fi

          python market_data_refresh.py \
            --mode "${mode}" \
            --db data/market_data.sqlite \
            --manifest data/manifest.json \
            --recent-bars 64 \
            --retries 3

          echo "effective_mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Guncel piyasa verisini artifact olarak sakla
        if: steps.gate.outputs.run_pipeline == 'true' && steps.gate.outputs.run_mode != 'scan_only' && steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: market-data-latest
          path: |
            data/market_data.sqlite
            data/manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Snapshot uzerinden planli zaman dilimini tara
        if: steps.gate.outputs.run_pipeline == 'true' && steps.gate.outputs.run_mode != 'full'
        env:
          DISABLE_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.send_telegram != true }}
          MARKET_DATA_DB: ${{ github.workspace }}/data/market_data.sqlite
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID || secrets.TG_THREAD_ID }}
        run: |
          set -euo pipefail
          test -s "${MARKET_DATA_DB}"

          if [ "$DISABLE_TELEGRAM" = "true" ]; then
            python parallel_snapshot_scan.py \
              --db "${MARKET_DATA_DB}" \
              --market bist \
              --periods "${{ steps.gate.outputs.scan_periods }}" \
              --no-state
          else
            python parallel_snapshot_scan.py \
              --db "${MARKET_DATA_DB}" \
              --market bist \
              --periods "${{ steps.gate.outputs.scan_periods }}" \
              --state state.json
          fi

      - name: Karar Paneli snapshot taramasini calistir
        if: steps.gate.outputs.run_pipeline == 'true' && steps.gate.outputs.run_mode != 'full'
        env:
          DISABLE_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.send_telegram != true }}
          MARKET_DATA_DB: ${{ github.workspace }}/data/market_data.sqlite
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ vars.TG_THREAD_ID || secrets.TG_THREAD_ID }}
        run: |
          set -euo pipefail
          mkdir -p data/decision-panel

          panel_args=(
            --snapshot-db "${MARKET_DATA_DB}"
            --universe XUTUM
            --min-score 70
            --min-turnover-mn 25
            --charts 0
            --output-dir data/decision-panel
          )

          if [ "$DISABLE_TELEGRAM" = "true" ]; then
            python decision_panel_scan.py "${panel_args[@]}"
          else
            python decision_panel_scan.py "${panel_args[@]}" \
              --telegram \
              --telegram-on-change \
              --state-file state.json
          fi

      - name: Karar Paneli sonucunu artifact olarak sakla
        if: always() && steps.gate.outputs.run_pipeline == 'true' && steps.gate.outputs.run_mode != 'full' && hashFiles('data/decision-panel/ozet.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: decision-panel-latest
          path: data/decision-panel
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Sinyal state snapshot'ini sakla
        if: always() && steps.gate.outputs.run_pipeline == 'true' && steps.gate.outputs.run_mode != 'full' && (github.event_name != 'workflow_dispatch' || inputs.send_telegram == true)
        uses: actions/upload-artifact@v4
        with:
          name: scanner-state-latest
          path: state.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Kapanis state dosyasini repoya isle
        if: always() && steps.gate.outputs.run_pipeline == 'true' && steps.gate.outputs.closing_run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp state.json /tmp/closing_state.json
          git restore --source=HEAD --worktree -- state.json
          git pull --rebase origin "${{ github.ref_name }}"
          python state_merge.py \
            --base state.json \
            --incoming /tmp/closing_state.json \
            --output state.json
          python -m json.tool state.json > /dev/null
          git add state.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: persist closing scanner state [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Eski rolling artifact'lari temizle
        if: always() && steps.gate.outputs.run_pipeline == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          for artifact_name in market-data-latest scanner-state-latest decision-panel-latest; do
            gh api "repos/${REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" |
              jq -r '.artifacts | sort_by(.created_at) | reverse | .[3:][]?.id' |
              while read -r artifact_id; do
                if [ -n "${artifact_id}" ]; then
                  gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
                fi
              done
          done
