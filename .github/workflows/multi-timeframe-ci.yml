name: Multi-Timeframe CI

on:
  pull_request:
    paths:
      - 'multi_timeframe_context.py'
      - 'tests/test_multi_timeframe_context.py'
      - 'market_data_store.py'
      - 'production_4h_visual.py'
      - '.github/workflows/multi-timeframe-ci.yml'
  push:
    branches: [main]
    paths:
      - 'multi_timeframe_context.py'
      - 'tests/test_multi_timeframe_context.py'
      - 'market_data_store.py'
      - 'production_4h_visual.py'
      - '.github/workflows/multi-timeframe-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
          pip install pytest
      - name: Compile
        run: python -m py_compile multi_timeframe_context.py
      - name: Unit tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests/test_multi_timeframe_context.py
