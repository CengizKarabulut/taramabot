name: 15m MTF Confirmation Edge
run-name: "15m · 30m/1H Confirmation · OOS Edge"

on:
  push:
    paths:
      - ".github/15m-mtf-edge-bootstrap"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mtf-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download 15m 30m 1H and 1D persistent archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data/history
          for period in 15m 30m 1H 1D; do
            name="historical-live-${period}"
            id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
            test -n "${id}"
            mkdir -p "/tmp/${period}"
            gh api "repos/${REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/${period}.zip"
            unzip -q -o "/tmp/${period}.zip" -d "/tmp/${period}"
            src="$(find "/tmp/${period}" -type f -name '*.sqlite' | head -n1)"
            test -s "${src}"
            cp "${src}" "data/history/${period}.sqlite"
          done
      - name: Measure MTF confirmation edge
        run: |
          python mtf_15m_edge.py \
            --db15 data/history/15m.sqlite \
            --db30 data/history/30m.sqlite \
            --db1h data/history/1H.sqlite \
            --db1d data/history/1D.sqlite \
            --max-symbols 0 \
            --output reports/15m-mtf-edge.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: 15m-mtf-edge-${{ github.run_id }}
          path: reports/15m-mtf-edge.json
          if-no-files-found: error
          retention-days: 30
