name: 15m Walk-Forward Calibration
run-name: "15m · A-I · Train/Validation/OOS Calibration"

on:
  push:
    paths:
      - ".github/intraday-15m-calibration-bootstrap"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: intraday-15m-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        scanner:
          - macd_cross
          - h8
          - i9
          - ema
          - rsi_macd
          - new_scan
          - smi_macd_full
          - smi_macd
          - rsi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download persistent 15m and 1D archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data/history /tmp/h15 /tmp/h1d
          get_artifact() {
            local name="$1"
            local destination="$2"
            local zipfile="$3"
            local artifact_id
            artifact_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=${name}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
            test -n "${artifact_id}"
            gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${zipfile}"
            unzip -q -o "${zipfile}" -d "${destination}"
          }
          get_artifact historical-live-15m /tmp/h15 /tmp/h15.zip
          get_artifact historical-live-1D /tmp/h1d /tmp/h1d.zip
          db15="$(find /tmp/h15 -type f -name '*.sqlite' | head -n1)"
          db1d="$(find /tmp/h1d -type f -name '*.sqlite' | head -n1)"
          test -s "${db15}"
          test -s "${db1d}"
          cp "${db15}" data/history/historical_15m.sqlite
          cp "${db1d}" data/history/historical_1D.sqlite
      - name: Calibrate ${{ matrix.scanner }} on 15m
        run: |
          mkdir -p reports/15m-calibration
          python intraday_profile_calibration.py \
            --db data/history/historical_15m.sqlite \
            --daily-db data/history/historical_1D.sqlite \
            --strategy "${{ matrix.scanner }}" \
            --max-symbols 0 \
            --warmup 240 \
            --output "reports/15m-calibration/${{ matrix.scanner }}.json"
      - name: Print calibration summary
        if: always()
        run: |
          test ! -f "reports/15m-calibration/${{ matrix.scanner }}.json" || cat "reports/15m-calibration/${{ matrix.scanner }}.json"
      - name: Upload calibration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 15m-calibration-${{ matrix.scanner }}-${{ github.run_id }}
          path: reports/15m-calibration/${{ matrix.scanner }}.json
          if-no-files-found: warn
          retention-days: 30
