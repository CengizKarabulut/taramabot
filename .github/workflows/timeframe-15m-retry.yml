name: Timeframe 15m Targeted Retry
run-name: "15m retry · EMA + new_scan"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run containing historical-15m artifact"
        required: true
        default: "33934764128"

permissions:
  actions: read
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scanner: ["ema", "new_scan"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt

      - name: Download 15m snapshot from source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/timeframe /tmp/tf15
          artifact_id="$(
            gh api --paginate "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" |
              jq -r '.artifacts[] | select(.name == "historical-15m-'"${SOURCE_RUN_ID}"'" and .expired == false) | .id' |
              tail -n1
          )"
          test -n "${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/tf15.zip
          unzip -q -o /tmp/tf15.zip -d /tmp/tf15
          cp /tmp/tf15/historical_15m.sqlite data/timeframe/historical_15m.sqlite 2>/dev/null || \
            cp /tmp/tf15/data/timeframe/historical_15m.sqlite data/timeframe/historical_15m.sqlite
          test -s data/timeframe/historical_15m.sqlite

      - name: Compile classic research
        run: python -m py_compile historical_exit_optimize.py historical_period_cost_sensitivity.py historical_replay.py strategy_optimizer.py trade_backtester.py strategy_exit_profiles.py

      - name: Optimize ${{ matrix.scanner }} 15m
        run: |
          mkdir -p reports/timeframe/15m
          python historical_exit_optimize.py \
            --db data/timeframe/historical_15m.sqlite \
            --strategy "${{ matrix.scanner }}" \
            --period 15m \
            --max-symbols 0 \
            --warmup 240 \
            --purge-bars 0 \
            --top-train 20 \
            --output "reports/timeframe/15m/${{ matrix.scanner }}_walk_forward.json"

      - name: OOS cost replay ${{ matrix.scanner }} 15m
        run: |
          python historical_period_cost_sensitivity.py \
            --db data/timeframe/historical_15m.sqlite \
            --strategy "${{ matrix.scanner }}" \
            --period 15m \
            --warmup 240 \
            --optimizer-json "reports/timeframe/15m/${{ matrix.scanner }}_walk_forward.json" \
            --output "reports/timeframe/15m/${{ matrix.scanner }}_costs.json"

      - name: Upload targeted retry result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-15m-${{ matrix.scanner }}-retry-${{ github.run_id }}
          path: reports/timeframe/15m
          if-no-files-found: warn
          retention-days: 90
