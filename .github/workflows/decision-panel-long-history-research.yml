name: Karar Paneli Long History Research
run-name: "Karar Paneli v6.4.4 · Long History · Full BIST · 1D"

on:
  workflow_run:
    workflows: ["Historical Daily Market Snapshot"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: decision-panel-long-history-research
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      source_run_id: ${{ steps.check.outputs.source_run_id }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            if [ "${CONCLUSION}" = "success" ]; then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              echo "source_run_id=${SOURCE_RUN}" >> "$GITHUB_OUTPUT"
            else
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "source_run_id=" >> "$GITHUB_OUTPUT"
            fi
          else
            run_id="$(
              gh api "repos/${REPOSITORY}/actions/artifacts?name=historical-daily-latest&per_page=100" |
                jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty'
            )"
            test -n "${run_id}"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "source_run_id=${run_id}" >> "$GITHUB_OUTPUT"
          fi

  optimize:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        setup:
          - BREAKOUT
          - PULLBACK
          - TREND DEVAMI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt

      - name: Download long-history daily snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ needs.gate.outputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/historical
          artifact_id="$(
            gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" |
              jq -r '.artifacts[] | select(.name == "historical-daily-latest" and .expired == false) | .id' |
              tail -n1
          )"
          test -n "${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/historical.zip
          unzip -q -o /tmp/historical.zip -d /tmp/historical
          cp /tmp/historical/data/historical_daily.sqlite data/historical_daily.sqlite 2>/dev/null || \
            cp /tmp/historical/historical_daily.sqlite data/historical_daily.sqlite
          test -s data/historical_daily.sqlite

      - name: Compile research engine
        run: python -m py_compile decision_panel_exit_optimize.py historical_decision_panel_v644.py strategy_optimizer.py trade_backtester.py

      - name: Optimize ${{ matrix.setup }} on long history
        run: |
          mkdir -p reports/decision_panel_long_history
          slug="$(echo '${{ matrix.setup }}' | tr '[:upper:] ' '[:lower:]_')"
          python decision_panel_exit_optimize.py \
            --db data/historical_daily.sqlite \
            --setup "${{ matrix.setup }}" \
            --min-score 75 \
            --output "reports/decision_panel_long_history/${slug}_walk_forward.json"

      - name: Upload setup result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-panel-long-${{ strategy.job-index }}-${{ github.run_id }}
          path: reports/decision_panel_long_history/
          if-no-files-found: warn
          retention-days: 30

  breakout-diagnostic:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt

      - name: Download long-history daily snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ needs.gate.outputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/historical
          artifact_id="$(
            gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" |
              jq -r '.artifacts[] | select(.name == "historical-daily-latest" and .expired == false) | .id' |
              tail -n1
          )"
          test -n "${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/historical.zip
          unzip -q -o /tmp/historical.zip -d /tmp/historical
          cp /tmp/historical/data/historical_daily.sqlite data/historical_daily.sqlite 2>/dev/null || \
            cp /tmp/historical/historical_daily.sqlite data/historical_daily.sqlite
          test -s data/historical_daily.sqlite

      - name: Diagnose exact v6.4.4 breakout gates on long history
        run: |
          mkdir -p reports/decision_panel_long_history
          python decision_panel_breakout_diagnostic.py \
            --db data/historical_daily.sqlite \
            --min-score 75 \
            --output reports/decision_panel_long_history/breakout_gate_funnel.json

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-panel-long-breakout-diagnostic-${{ github.run_id }}
          path: reports/decision_panel_long_history/breakout_gate_funnel.json
          if-no-files-found: warn
          retention-days: 30
