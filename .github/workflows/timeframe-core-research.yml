name: Timeframe Core Research 1H 4H
run-name: "1H/4H · 10 Systems · Walk Forward + OOS Costs"

on:
  push:
    paths:
      - ".github/timeframe-core-research-bootstrap"
      - "historical_period_refresh.py"
      - "historical_period_cost_sensitivity.py"
      - "decision_panel_period_optimize.py"
      - ".github/workflows/timeframe-core-research.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: timeframe-core-research
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        period: ["1H", "4H"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Compile research refresh
        run: python -m py_compile historical_period_refresh.py market_data_refresh.py market_data_store.py
      - name: Build long-history ${{ matrix.period }} snapshot
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          mkdir -p data/timeframe
          python historical_period_refresh.py \
            --period "${{ matrix.period }}" \
            --bars 2500 \
            --retries 3 \
            --db "data/timeframe/historical_${{ matrix.period }}.sqlite" \
            --manifest "data/timeframe/historical_${{ matrix.period }}_manifest.json"
      - name: Upload timeframe snapshot
        uses: actions/upload-artifact@v4
        with:
          name: historical-${{ matrix.period }}-${{ github.run_id }}
          path: |
            data/timeframe/historical_${{ matrix.period }}.sqlite
            data/timeframe/historical_${{ matrix.period }}_manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  classic:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        period: ["1H", "4H"]
        scanner:
          - macd_cross
          - h8
          - i9
          - ema
          - rsi_macd
          - new_scan
          - smi_macd_full
          - smi_macd
          - rsi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download ${{ matrix.period }} snapshot
        uses: actions/download-artifact@v4
        with:
          name: historical-${{ matrix.period }}-${{ github.run_id }}
          path: data/timeframe
      - name: Compile classic research
        run: python -m py_compile historical_exit_optimize.py historical_period_cost_sensitivity.py historical_replay.py strategy_optimizer.py trade_backtester.py strategy_exit_profiles.py
      - name: Optimize ${{ matrix.scanner }} ${{ matrix.period }}
        run: |
          mkdir -p reports/timeframe/${{ matrix.period }}
          python historical_exit_optimize.py \
            --db "data/timeframe/historical_${{ matrix.period }}.sqlite" \
            --strategy "${{ matrix.scanner }}" \
            --period "${{ matrix.period }}" \
            --max-symbols 0 \
            --warmup 240 \
            --purge-bars 0 \
            --top-train 20 \
            --output "reports/timeframe/${{ matrix.period }}/${{ matrix.scanner }}_walk_forward.json"
      - name: OOS cost replay ${{ matrix.scanner }} ${{ matrix.period }}
        run: |
          python historical_period_cost_sensitivity.py \
            --db "data/timeframe/historical_${{ matrix.period }}.sqlite" \
            --strategy "${{ matrix.scanner }}" \
            --period "${{ matrix.period }}" \
            --warmup 240 \
            --optimizer-json "reports/timeframe/${{ matrix.period }}/${{ matrix.scanner }}_walk_forward.json" \
            --output "reports/timeframe/${{ matrix.period }}/${{ matrix.scanner }}_costs.json"
      - name: Upload classic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-${{ matrix.period }}-${{ matrix.scanner }}-${{ github.run_id }}
          path: reports/timeframe/${{ matrix.period }}
          if-no-files-found: warn
          retention-days: 30

  system-j:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        period: ["1H", "4H"]
        setup: ["PULLBACK", "BREAKOUT", "TREND DEVAMI"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download ${{ matrix.period }} snapshot
        uses: actions/download-artifact@v4
        with:
          name: historical-${{ matrix.period }}-${{ github.run_id }}
          path: data/timeframe
      - name: Compile System J research
        run: python -m py_compile decision_panel_period_optimize.py decision_panel_v645_signal.py historical_decision_panel_v644.py trade_backtester.py strategy_exit_profiles.py
      - name: Optimize System J ${{ matrix.setup }} ${{ matrix.period }}
        run: |
          mkdir -p reports/timeframe/${{ matrix.period }}/system-j
          slug="$(printf '%s' '${{ matrix.setup }}' | tr '[:upper:] ' '[:lower:]_')"
          python decision_panel_period_optimize.py \
            --db "data/timeframe/historical_${{ matrix.period }}.sqlite" \
            --period "${{ matrix.period }}" \
            --setup "${{ matrix.setup }}" \
            --min-score 75 \
            --output "reports/timeframe/${{ matrix.period }}/system-j/${slug}.json"
      - name: Upload System J result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-${{ matrix.period }}-system-j-${{ strategy.job-index }}-${{ github.run_id }}
          path: reports/timeframe/${{ matrix.period }}/system-j
          if-no-files-found: warn
          retention-days: 30
