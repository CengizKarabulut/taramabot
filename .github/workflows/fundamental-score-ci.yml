name: Fundamental Score CI

on:
  pull_request:
    paths:
      - "fundamental_score.py"
      - "tests/test_fundamental_score.py"
      - ".github/workflows/fundamental-score-ci.yml"
  push:
    branches: [main]
    paths:
      - "fundamental_score.py"
      - "tests/test_fundamental_score.py"
      - ".github/workflows/fundamental-score-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundamental-score-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Compile
        run: python -m py_compile fundamental_score.py tests/test_fundamental_score.py
      - name: Unit tests
        run: python -m unittest -v tests.test_fundamental_score
