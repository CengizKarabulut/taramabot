name: Historical Daily Market Snapshot
run-name: "Historical 1D · Full BIST · 2500 Bars"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/historical-daily-bootstrap"

permissions:
  actions: read
  contents: read

concurrency:
  group: historical-daily-market-snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt

      - name: Compile historical data builder
        run: python -m py_compile historical_daily_refresh.py market_data_store.py

      - name: Build long-history BIST daily snapshot
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          mkdir -p data
          python historical_daily_refresh.py \
            --db data/historical_daily.sqlite \
            --manifest data/historical_daily_manifest.json \
            --bars 2500 \
            --retries 3

      - name: Show manifest
        run: cat data/historical_daily_manifest.json

      - name: Upload historical daily snapshot
        uses: actions/upload-artifact@v4
        with:
          name: historical-daily-latest
          path: |
            data/historical_daily.sqlite
            data/historical_daily_manifest.json
          if-no-files-found: error
          retention-days: 30
