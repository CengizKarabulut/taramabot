name: Daily G Parity Smoke
run-name: "1D G parity · BIGTK UFUK"

on:
  push:
    paths:
      - ".github/daily-g-parity-trigger"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download latest market snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/market-data
          market_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=market-data-latest&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "${market_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${market_id}/zip" > /tmp/market-data.zip
          unzip -q -o /tmp/market-data.zip -d /tmp/market-data
          db="$(find /tmp/market-data -type f -name 'market_data.sqlite' | head -n1)"
          test -s "${db}"
          cp "${db}" data/market_data.sqlite
          echo "artifact_id=${market_id}"
      - name: Verify BIGTK and UFUK without state
        run: |
          python verify_daily_g_parity.py --db data/market_data.sqlite --symbols BIGTK UFUK
