name: StockMarketLab Scheduler Heartbeat
run-name: "Snapshot Scheduler Heartbeat"

on:
  workflow_dispatch:
  schedule:
    # Acil bootstrap: self-dispatch zinciri herhangi bir nedenle koparsa
    # her is gunu 09:00 TR'de yeniden baslatmayi dener.
    - cron: "0 6 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan_scheduler_heartbeat.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: stockmarketlab-scheduler-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scheduler state geri yukle
        uses: actions/cache@v4
        with:
          path: .scheduler/taramabot_slots.json
          key: taramabot-scheduler-${{ github.run_id }}
          restore-keys: taramabot-scheduler-

      - name: Eksik snapshot slotlarini izle ve tamamla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_WORKFLOW: cached_continuous_scan.yml
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .scheduler
          STATE=.scheduler/taramabot_slots.json
          [ -s "${STATE}" ] || echo '{}' > "${STATE}"

          mark_done() {
            local key="$1"
            local tmp
            tmp="$(mktemp)"
            jq --arg key "${key}" --arg value "$(date -u +%FT%TZ)" '.[$key]=$value' "${STATE}" > "${tmp}"
            mv "${tmp}" "${STATE}"
          }

          check_slots() {
            local day hhmm
            day="$(TZ=Europe/Istanbul date +%u)"
            hhmm="$(TZ=Europe/Istanbul date +%H%M)"

            # Heartbeat 7/24 yasamaya devam eder; piyasa penceresi disinda
            # yalnizca bekler ve herhangi bir tarama baslatmaz.
            if [ "${day}" -gt 5 ] || [ "${hhmm}" -lt 0900 ] || [ "${hhmm}" -gt 1925 ]; then
              echo "TR gun=${day} saat=${hhmm}: piyasa izleme penceresi disinda; zincir korunuyor."
              return 0
            fi

            while IFS='|' read -r slot_key period schedule_expr slot_utc; do
              [ -n "${slot_key}" ] || continue
              if jq -e --arg key "${slot_key}" 'has($key)' "${STATE}" >/dev/null; then
                continue
              fi

              runs_json="$(gh api "repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=100")"
              direct_title="Snapshot Tarama · ${schedule_expr}"
              recovery_title="Snapshot Tarama · ${period}"

              success_count="$(printf '%s' "${runs_json}" | jq \
                --arg since "${slot_utc}" \
                --arg direct "${direct_title}" \
                --arg recovery "${recovery_title}" \
                '[.workflow_runs[] | select(.created_at >= $since) | select(.display_title == $direct or .display_title == $recovery) | select(.conclusion == "success")] | length')"

              if [ "${success_count}" -gt 0 ]; then
                echo "${slot_key} (${period}) basarili bir kosuyla tamamlanmis."
                mark_done "${slot_key}"
                continue
              fi

              active_count="$(printf '%s' "${runs_json}" | jq \
                --arg since "${slot_utc}" \
                --arg direct "${direct_title}" \
                --arg recovery "${recovery_title}" \
                '[.workflow_runs[] | select(.created_at >= $since) | select(.display_title == $direct or .display_title == $recovery) | select(.status == "queued" or .status == "in_progress")] | length')"

              if [ "${active_count}" -gt 0 ]; then
                echo "${slot_key} (${period}) aktif/kuyrukta; ikinci kosu acilmiyor."
                continue
              fi

              echo "Eksik veya basarisiz slot bulundu: ${slot_key} (${period}); kurtarma kosusu baslatiliyor."
              gh workflow run "${TARGET_WORKFLOW}" --repo "${REPOSITORY}" --ref main -f mode=intraday_once -f periods="${period}" -f send_telegram=true
              # Burada tamamlandi diye isaretleme yapilmaz. Sonraki kontrol,
              # kurtarma kosusunun gercekten success olup olmadigini dogrular.
            done < <(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Istanbul")
          now = datetime.now(tz)
          if now.weekday() >= 5:
              raise SystemExit(0)

          slots = [
              (10,20,"1H","20 7-15 * * 1-5"),(11,20,"1H","20 7-15 * * 1-5"),
              (12,20,"1H","20 7-15 * * 1-5"),(13,20,"1H","20 7-15 * * 1-5"),
              (14,20,"1H","20 7-15 * * 1-5"),(15,20,"1H","20 7-15 * * 1-5"),
              (16,20,"1H","20 7-15 * * 1-5"),(17,20,"1H","20 7-15 * * 1-5"),
              (17,40,"1H","40 14 * * 1-5"),(18,20,"1H","20 7-15 * * 1-5"),
              (11,0,"4H","0 8,10 * * 1-5"),(13,0,"4H","0 8,10 * * 1-5"),
              (14,30,"4H","30 11,13-15 * * 1-5"),(16,30,"4H","30 11,13-15 * * 1-5"),
              (17,30,"4H","30 11,13-15 * * 1-5"),(18,30,"4H","30 11,13-15 * * 1-5"),
              (10,45,"1D","45 7,9,11,13-15 * * 1-5"),(12,45,"1D","45 7,9,11,13-15 * * 1-5"),
              (14,45,"1D","45 7,9,11,13-15 * * 1-5"),(16,45,"1D","45 7,9,11,13-15 * * 1-5"),
              (17,45,"1D","45 7,9,11,13-15 * * 1-5"),(18,45,"1D","45 7,9,11,13-15 * * 1-5"),
              (10,30,"1W","30 7 * * 1-5"),(13,45,"1W","45 10 * * 1-5"),
              (16,0,"1W","0 13 * * 1-5"),(17,25,"1W","25 14 * * 1-5"),
              (19,0,"1W","0 16 * * 1-5"),
          ]

          # Ana cron'a 6 dakika oncelik ver; zincir bir sure kesilirse ayni gun
          # icindeki son 90 dakikalik slotlari da geriye donuk tamamlayabilsin.
          min_age = timedelta(minutes=6)
          max_age = timedelta(minutes=90)
          for hour, minute, period, expression in slots:
              due = now.replace(hour=hour, minute=minute, second=0, microsecond=0)
              age = now - due
              if min_age <= age <= max_age:
                  utc = due.astimezone(ZoneInfo("UTC")).isoformat().replace("+00:00", "Z")
                  key = f"{due.date().isoformat()}-{due.strftime('%H%M')}-{period}"
                  print(f"{key}|{period}|{expression}|{utc}")
          PY
            )
          }

          # Bir kosu yaklasik 50 dakika boyunca dakikada bir kontrol eder.
          # Piyasa kapali olsa bile kosu hemen bitmez; boylece 09:00 cron'una
          # bagimli olmadan zincir gece ve hafta sonu boyunca devredilebilir.
          end=$(( $(date +%s) + 3000 ))
          while [ "$(date +%s)" -lt "${end}" ]; do
            check_slots || true
            sleep 60
          done

      - name: Scheduler state sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .scheduler/taramabot_slots.json
          key: taramabot-scheduler-${{ github.run_id }}

      - name: Heartbeat zincirini 7/24 devam ettir
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Heartbeat devrediliyor; cron artik yalnizca acil bootstrap yedegi."
          gh workflow run scan_scheduler_heartbeat.yml --repo "${REPOSITORY}" --ref main
