name: StockMarketLab Scheduler Heartbeat
run-name: "Snapshot Scheduler Heartbeat"

on:
  workflow_dispatch:
  schedule:
    # Zincir koparsa her is gunu 09:00 TR'de yeniden baslat.
    - cron: "0 6 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan_scheduler_heartbeat.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: stockmarketlab-scheduler-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scheduler state geri yukle
        uses: actions/cache@v4
        with:
          path: .scheduler/taramabot_slots.json
          key: taramabot-scheduler-${{ github.run_id }}
          restore-keys: taramabot-scheduler-

      - name: Eksik snapshot slotlarini izle ve tamamla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_WORKFLOW: cached_continuous_scan.yml
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scheduler
          STATE=.scheduler/taramabot_slots.json
          [ -s "${STATE}" ] || echo '{}' > "${STATE}"

          mark_done() {
            local key="$1"
            local tmp
            tmp="$(mktemp)"
            jq --arg key "${key}" --arg value "$(date -u +%FT%TZ)" '.[$key]=$value' "${STATE}" > "${tmp}"
            mv "${tmp}" "${STATE}"
          }

          check_slots() {
            while IFS='|' read -r slot_key period schedule_expr slot_utc; do
              [ -n "${slot_key}" ] || continue
              if jq -e --arg key "${slot_key}" 'has($key)' "${STATE}" >/dev/null; then continue; fi
              runs_json="$(gh api "repos/${REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=100")"
              covered="$(printf '%s' "${runs_json}" | jq --arg since "${slot_utc}" --arg title "Snapshot Tarama · ${schedule_expr}" '[.workflow_runs[] | select(.created_at >= $since) | select(.display_title == $title)] | length')"
              if [ "${covered}" -gt 0 ]; then
                echo "${slot_key} (${period}) ana cron tarafindan zaten calismis."
                mark_done "${slot_key}"
                continue
              fi
              echo "Eksik slot bulundu: ${slot_key} (${period}); kurtarma kosusu baslatiliyor."
              gh workflow run "${TARGET_WORKFLOW}" --repo "${REPOSITORY}" --ref main -f mode=intraday_once -f periods="${period}" -f send_telegram=true
              mark_done "${slot_key}"
            done < <(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          tz=ZoneInfo("Europe/Istanbul"); now=datetime.now(tz)
          if now.weekday()>=5: raise SystemExit(0)
          slots=[(10,20,"1H","20 7-15 * * 1-5"),(11,20,"1H","20 7-15 * * 1-5"),(12,20,"1H","20 7-15 * * 1-5"),(13,20,"1H","20 7-15 * * 1-5"),(14,20,"1H","20 7-15 * * 1-5"),(15,20,"1H","20 7-15 * * 1-5"),(16,20,"1H","20 7-15 * * 1-5"),(17,20,"1H","20 7-15 * * 1-5"),(17,40,"1H","40 14 * * 1-5"),(18,20,"1H","20 7-15 * * 1-5"),(11,0,"4H","0 8,10 * * 1-5"),(13,0,"4H","0 8,10 * * 1-5"),(14,30,"4H","30 11,13-15 * * 1-5"),(16,30,"4H","30 11,13-15 * * 1-5"),(17,30,"4H","30 11,13-15 * * 1-5"),(18,30,"4H","30 11,13-15 * * 1-5"),(10,45,"1D","45 7,9,11,13-15 * * 1-5"),(12,45,"1D","45 7,9,11,13-15 * * 1-5"),(14,45,"1D","45 7,9,11,13-15 * * 1-5"),(16,45,"1D","45 7,9,11,13-15 * * 1-5"),(17,45,"1D","45 7,9,11,13-15 * * 1-5"),(18,45,"1D","45 7,9,11,13-15 * * 1-5"),(10,30,"1W","30 7 * * 1-5"),(13,45,"1W","45 10 * * 1-5"),(16,0,"1W","0 13 * * 1-5"),(17,25,"1W","25 14 * * 1-5"),(19,0,"1W","0 16 * * 1-5")]
          grace=timedelta(minutes=20)
          for h,m,p,e in slots:
            due=now.replace(hour=h,minute=m,second=0,microsecond=0); age=now-due
            if timedelta(0)<=age<=grace:
              u=due.astimezone(ZoneInfo("UTC")).isoformat().replace("+00:00","Z"); k=f"{due.date().isoformat()}-{due.strftime('%H%M')}-{p}"; print(f"{k}|{p}|{e}|{u}")
          PY
          )
          }
          end=$(( $(date +%s) + 3000 ))
          while [ "$(date +%s)" -lt "${end}" ]; do check_slots || true; sleep 60; done

      - name: Scheduler state sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .scheduler/taramabot_slots.json
          key: taramabot-scheduler-${{ github.run_id }}

      - name: Heartbeat zincirini devam ettir
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run scan_scheduler_heartbeat.yml --repo "${REPOSITORY}" --ref main
