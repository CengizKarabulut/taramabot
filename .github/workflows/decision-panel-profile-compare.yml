name: Karar Paneli · Final Profile Compare
run-name: "Karar Paneli · Current vs Proposed · Long History · 1D"

on:
  push:
    paths:
      - ".github/decision-panel-profile-compare-bootstrap"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download long-history daily snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/historical-daily
          artifact_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=historical-daily-latest&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "${artifact_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/historical-daily.zip
          unzip -q -o /tmp/historical-daily.zip -d /tmp/historical-daily
          if [ -f /tmp/historical-daily/historical_daily.sqlite ]; then
            cp /tmp/historical-daily/historical_daily.sqlite data/historical_daily.sqlite
          else
            cp /tmp/historical-daily/data/historical_daily.sqlite data/historical_daily.sqlite
          fi
          test -s data/historical_daily.sqlite
      - name: Compile comparison
        run: python -m py_compile decision_panel_profile_compare.py
      - name: Compare current and proposed profiles
        run: |
          mkdir -p reports/decision-panel-final
          python decision_panel_profile_compare.py \
            --db data/historical_daily.sqlite \
            --output reports/decision-panel-final/profile_compare.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: decision-panel-final-profile-compare-${{ github.run_id }}
          path: reports/decision-panel-final/profile_compare.json
          retention-days: 30
