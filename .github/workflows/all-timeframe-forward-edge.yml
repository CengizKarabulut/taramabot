name: All Timeframe Raw Forward Edge
run-name: "30m-1M · A-I · OOS Raw Edge"

on:
  push:
    paths:
      - ".github/all-timeframe-forward-edge-bootstrap"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        period: [30m, 45m, 1H, 2H, 4H, 1D, 1W, 1M]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cached-scan.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cached-scan.txt
      - name: Download timeframe and daily history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PERIOD: ${{ matrix.period }}
        run: |
          set -euo pipefail
          mkdir -p data/history /tmp/current /tmp/daily
          current_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=historical-live-${PERIOD}&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          daily_id="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=historical-live-1D&per_page=100" | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          test -n "${current_id}"
          test -n "${daily_id}"
          gh api "repos/${REPOSITORY}/actions/artifacts/${current_id}/zip" > /tmp/current.zip
          unzip -q -o /tmp/current.zip -d /tmp/current
          current_db="$(find /tmp/current -type f -name '*.sqlite' | head -n1)"
          test -s "${current_db}"
          cp "${current_db}" "data/history/${PERIOD}.sqlite"
          if [ "${PERIOD}" = "1D" ]; then
            cp "${current_db}" data/history/1D.sqlite
          else
            gh api "repos/${REPOSITORY}/actions/artifacts/${daily_id}/zip" > /tmp/daily.zip
            unzip -q -o /tmp/daily.zip -d /tmp/daily
            daily_db="$(find /tmp/daily -type f -name '*.sqlite' | head -n1)"
            test -s "${daily_db}"
            cp "${daily_db}" data/history/1D.sqlite
          fi
      - name: Measure raw edge ${{ matrix.period }}
        run: |
          mkdir -p reports/all-timeframe-edge
          python timeframe_forward_edge.py \
            --db "data/history/${{ matrix.period }}.sqlite" \
            --daily-db data/history/1D.sqlite \
            --period "${{ matrix.period }}" \
            --warmup 240 \
            --max-symbols 0 \
            --output "reports/all-timeframe-edge/${{ matrix.period }}.json"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: timeframe-edge-${{ matrix.period }}-${{ github.run_id }}
          path: reports/all-timeframe-edge/${{ matrix.period }}.json
          if-no-files-found: error
          retention-days: 30
